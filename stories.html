<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中华故事 · 三语口语课</title>
<style>
  :root{
    --bg:#E9E4D9; --paper:#FBF8F1; --paper2:#F3EEE2;
    --ink:#2E2A24; --text2:#605849; --muted:#988F80;
    --line:#E4DCCB; --line2:#EFE9DC;
    --red:#AE4A32; --blue:#3E6470; --ochre:#97703F;
    --sans:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --kai:'Kaiti SC','STKaiti','KaiTi',serif;
    --song:'Songti SC','STSong','Noto Serif CJK SC',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
       display:flex;align-items:center;justify-content:center;overflow:hidden}
  .app{width:min(1440px,100vw);height:min(920px,100vh);background:var(--paper);
       border:1px solid #D8D0C1;display:flex;position:relative}
  .app.no-side aside{display:none}

  /* 故事目录 */
  aside{width:224px;flex:0 0 224px;background:var(--paper2);border-right:1px solid var(--line);
        display:flex;flex-direction:column}
  .brand{padding:22px 18px 15px;border-bottom:1px solid var(--line)}
  .seal{width:33px;height:33px;background:var(--red);color:#fff;display:flex;align-items:center;
        justify-content:center;font-family:var(--kai);font-size:19px;margin-bottom:11px}
  .brand h1{font-family:var(--song);font-size:19px;letter-spacing:2px;font-weight:600}
  .brand p{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}
  .story-list{flex:1;overflow-y:auto;padding:7px}
  .story-list::-webkit-scrollbar{width:5px}
  .story-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  .cat{font-size:10px;color:var(--muted);letter-spacing:2px;padding:12px 10px 5px}
  .sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;
         color:var(--text2);cursor:pointer;border-left:2px solid transparent}
  .sitem:hover{background:#EAE3D5}
  .sitem.on{border-left-color:var(--red);background:#EDE5D7;color:var(--ink);font-weight:600}
  .sitem .n{font-size:10px;color:var(--muted);width:18px;flex:0 0 18px}
  .side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}

  /* 主体 */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{flex:0 0 auto;display:flex;align-items:center;gap:24px;padding:13px 26px;
         border-bottom:1px solid var(--line)}
  .ttl{font-family:var(--song);font-size:21px;font-weight:600;letter-spacing:2px;white-space:nowrap;line-height:1.15}
  .ttl small{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);
             letter-spacing:.3px;font-weight:400;margin-top:3px}
  .picker{display:flex;align-items:center;gap:2px}
  .picker .lb{font-size:10px;color:var(--muted);letter-spacing:1px;margin-right:6px}
  .picker button{border:0;border-bottom:2px solid transparent;background:none;
                 font-family:var(--sans);font-size:13px;color:var(--muted);
                 padding:6px 11px;cursor:pointer;transition:.15s}
  .picker button:hover{color:var(--ink)}
  .picker button.on{font-weight:600}
  .picker button.on[data-lang="yue"]{color:var(--red);border-bottom-color:var(--red)}
  .picker button.on[data-lang="man"]{color:var(--blue);border-bottom-color:var(--blue)}
  .picker button.on[data-lang="eng"]{color:var(--ochre);border-bottom-color:var(--ochre)}
  .picker button.sec[data-lang]{opacity:.72;border-bottom-style:dashed}
  .side-toggle{flex:0 0 32px;display:flex;align-items:center;justify-content:center}
  .spacer{flex:1}
  .ghost{width:32px;height:32px;border:1px solid var(--line);background:none;
         color:var(--muted);cursor:pointer;font-size:15px}
  .ghost:hover{color:var(--ink);border-color:var(--muted)}

  /* 章节导航 */
  .tabs{flex:0 0 auto;display:flex;gap:28px;padding:0 26px;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-bottom:2px solid transparent;background:none;
               font-family:var(--song);font-size:14px;letter-spacing:1px;
               color:var(--muted);padding:11px 2px;cursor:pointer;transition:.15s}
  .tabs button:hover{color:var(--text2)}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--red)}

  .stage{flex:1;position:relative;overflow:hidden}
  .page{position:absolute;inset:0;display:none;overflow-y:auto;padding:20px 30px 28px}
  .page.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page::-webkit-scrollbar{width:6px}
  .page::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* 故事页 */
  .hero{text-align:center;padding:2px 0 13px;border-bottom:1px solid var(--line2);margin-bottom:15px}
  .hrow{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:5px 0}
  .hrow .tg{font-size:10px;color:var(--muted);letter-spacing:1px;width:36px;text-align:right}
  .hrow .nm{font-family:var(--kai);font-size:25px;font-weight:600;letter-spacing:3px}
  .hrow .nm.lat{font-family:var(--song);font-size:18px;letter-spacing:0}
  .hrow .rm{font-size:11px;color:var(--muted)}
  .hrow.main .nm{color:var(--red)}
  .strip{display:flex;justify-content:center;margin-bottom:16px}
  .strip .pic{position:relative;width:min(100%,760px);background:var(--paper2);
              border:1px solid var(--line);overflow:hidden;line-height:0}
  .strip img{width:100%;height:auto;display:block}
  .strip .lb{position:absolute;left:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
             border-right:1px solid var(--line);padding:4px 11px;font-size:10px;line-height:1.4;
             color:var(--text2);letter-spacing:2px}
  .lines{display:flex;flex-direction:column}
  .line{display:flex;align-items:flex-start;gap:12px;padding:9px 8px;border-bottom:1px solid var(--line2)}
  .line:hover{background:#F7F2E7}
  .line .no{font-family:var(--song);font-size:11px;color:var(--muted);width:22px;flex:0 0 22px;padding-top:5px}
  .line .tx{flex:1;cursor:pointer;min-width:0}
  .big{font-family:var(--kai);font-size:20px;line-height:1.5;letter-spacing:.5px}
  .big.lat{font-family:var(--song);font-size:16px;letter-spacing:0}
  .rom{font-size:11px;color:var(--ochre);margin-top:2px;letter-spacing:.2px}
  .alt{margin-top:5px;font-size:14px;color:var(--text2)}
  .alt.lat{font-family:var(--song);font-size:13px}
  .alt .ar{font-size:10px;color:var(--muted);margin-left:7px}
  .say{flex:0 0 28px;width:28px;height:28px;border:1px solid var(--line);background:var(--paper);
       color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .say:hover,.say.speaking{border-color:var(--red);color:var(--red)}

  /* 全文朗读 */
  .fullbar{display:flex;align-items:center;gap:12px;margin:-3px 0 14px}
  .fullread{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--red);
            background:var(--red);color:#fff;font-family:var(--sans);font-size:13px;
            padding:7px 15px;cursor:pointer;transition:.15s;letter-spacing:1px}
  .fullread:hover{background:#96402C;border-color:#96402C}
  .fullread.speaking{background:var(--blue);border-color:var(--blue)}
  .fullread svg{width:15px;height:15px}
  .fb-tip{font-size:11px;color:var(--muted)}

  /* 词语 */
  .words{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .word{border:1px solid var(--line);background:var(--paper);padding:14px 8px;
        text-align:center;cursor:pointer;transition:.15s}
  .word:hover{border-color:var(--red);background:#FBF4E9}
  .w{font-family:var(--kai);font-size:24px;font-weight:600}
  .w.lat{font-family:var(--song);font-size:15px}
  .word .rom{font-size:11px;color:var(--ochre);margin-top:4px;min-height:14px}
  .word .sec{font-size:12px;color:var(--text2);margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}
  .word .sec i{font-style:normal;font-size:10px;color:var(--muted);display:block;margin-top:2px}

  /* 复述 */
  .retell{display:grid;grid-template-columns:44% 56%;gap:20px;height:100%}
  .retell .art{border:1px solid var(--line);background:var(--paper2);overflow:hidden;min-height:250px}
  .retell .art svg,.retell .art img{width:100%;height:100%;display:block}
  .retell .art img{object-fit:contain;object-position:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:var(--paper2);padding:7px 12px;font-size:13px}
  .tbtn{border:1px solid var(--line);background:none;padding:7px 14px;font-size:12px;
        color:var(--text2);cursor:pointer;font-family:var(--sans)}
  .tbtn:hover{border-color:var(--red);color:var(--red)}
  .reveal{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:none}
  .reveal.show{display:block}
  .rl{font-family:var(--kai);font-size:17px;line-height:1.85;padding:2px 0}
  .rr{font-family:var(--sans);font-size:10px;color:var(--muted);display:block;line-height:1.4}

  /* 讨论 */
  .qs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .qcard{border:1px solid var(--line);padding:18px;cursor:pointer;background:var(--paper);transition:.15s}
  .qcard:hover{border-color:var(--red)}
  .qq{font-family:var(--kai);font-size:18px;line-height:1.6}
  .qe{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .ans{margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);
       font-size:13px;color:var(--text2);line-height:1.8;display:none}
  .qcard.open .ans{display:block}

  /* 文化 */
  .cul{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .panel{border:1px solid var(--line);padding:20px}
  .fact{display:flex;gap:14px;margin-bottom:13px;font-size:14px;line-height:1.7}
  .fact .k{flex:0 0 52px;color:var(--muted);font-size:11px;padding-top:3px;letter-spacing:1px}
  .fact .v{flex:1}
  .examples{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
  .ex{font-family:var(--kai);font-size:16px;line-height:1.55;margin-bottom:11px}
  .ex .tg{font-family:var(--sans);font-size:10px;color:var(--muted);margin-right:7px;letter-spacing:1px}
  .ex .rr{font-family:var(--sans);font-size:10px;color:var(--ochre);margin-top:3px}
  .ex.main{color:var(--red)}
  .next{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;font-size:13px;color:var(--text2)}

  #toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
         background:var(--ink);color:#fff;padding:8px 16px;font-size:12px;
         opacity:0;pointer-events:none;transition:.2s;z-index:9}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:980px){aside{width:172px;flex-basis:172px}.words{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="seal">故</div>
      <h1>中华故事</h1>
      <p>三语口语课 · 粤 普 英</p>
    </div>
    <div class="story-list" id="storyList"></div>
    <div class="side-foot">共 <span id="storyCount">0</span> 则</div>
  </aside>

  <main>
    <header>
      <button class="ghost side-toggle" id="sideBtn" title="显示 / 隐藏故事目录">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16"/></svg>
      </button>
      <div class="ttl" id="ttl">—</div>
      <div class="picker" id="langPick">
        <span class="lb">显示语言</span>
        <button data-lang="yue">粤语</button>
        <button data-lang="man" class="on">普通话</button>
        <button data-lang="eng">English</button>
      </div>
      <div class="spacer"></div>
      <button class="ghost" id="fullBtn" title="全屏">⛶</button>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="story" class="on">故事</button>
      <button data-tab="words">词语</button>
      <button data-tab="retell">复述</button>
      <button data-tab="discuss">讨论</button>
      <button data-tab="culture">文化</button>
    </nav>

    <div class="stage">
      <section class="page active" data-tab="story">
        <div class="hero"><div id="heroTitles"></div></div>
        <div class="fullbar">
          <button class="fullread" id="fullReadBtn" title="按主要语言朗读整个故事"></button>
          <span class="fb-tip" id="fullReadTip"></span>
        </div>
        <div class="strip" id="storyStrip"></div>
        <div class="lines" id="storyLines"></div>
      </section>
      <section class="page" data-tab="words"><div class="words" id="wordGrid"></div></section>
      <section class="page" data-tab="retell">
        <div class="retell">
          <div class="art" id="retellArt"></div>
          <div>
            <div class="chips" id="retellChips"></div>
            <button class="tbtn" id="revealBtn">看原文</button>
            <div class="reveal" id="revealBox"></div>
          </div>
        </div>
      </section>
      <section class="page" data-tab="discuss"><div class="qs" id="discussBox"></div></section>
      <section class="page" data-tab="culture">
        <div class="cul">
          <div class="panel">
            <div class="fact"><div class="k">意思</div><div class="v" id="culMean"></div></div>
            <div class="fact"><div class="k">English</div><div class="v" id="culEn"></div></div>
            <div class="fact"><div class="k">近义</div><div class="v" id="culNear"></div></div>
            <div class="fact"><div class="k">反义</div><div class="v" id="culOpp"></div></div>
            <div class="examples" id="culEx"></div>
          </div>
          <div class="panel">
            <div class="fact"><div class="k">一句话</div><div class="v" id="culGist"></div></div>
            <div class="next" id="nextUp"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="toast"></div>
</div>

<script>
const state={story:0, langs:['man'], tab:'story'};
const AUDIO=[];
const LNAME={yue:'粤语',man:'普通话',eng:'English'};
const LCODE={yue:'zh-HK',man:'zh-CN',eng:'en-US'};
const SPK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function reg(lang,text){AUDIO.push({lang,text});return AUDIO.length-1;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function S(){return STORIES[state.story];}
function storyImg(){return `images/${String(state.story+1).padStart(2,'0')}.jpg`;}
function speak(lang,text,btn){
  if(!('speechSynthesis' in window)){toast('浏览器不支持朗读');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LCODE[lang]||'zh-CN';u.rate=lang==='eng'?0.85:0.82;
    const vs=speechSynthesis.getVoices();
    let v=vs.find(x=>x.lang.toLowerCase()===u.lang.toLowerCase());
    if(!v&&lang!=='eng')v=vs.find(x=>x.lang.toLowerCase().startsWith('zh'));
    if(v)u.voice=v;
    if(btn){btn.classList.add('speaking');u.onend=()=>btn.classList.remove('speaking');u.onerror=()=>btn.classList.remove('speaking');}
    speechSynthesis.speak(u);
  }catch(e){toast('朗读失败，请看着文字读一遍');}
}

/* 插画 */
function sceneArt(kind){
  const bg=`<rect width="600" height="360" fill="#F2EAD9"/>
    <path d="M0 232 Q110 208 220 232 T440 226 T600 230 V360 H0Z" fill="#E9E0CB"/>
    <path d="M0 270 Q150 244 300 272 T600 264 V360 H0Z" fill="#DFD5BC"/>`;
  const trees=`<g transform="translate(26,150)"><use href="#tree"/></g>
    <g transform="translate(486,168) scale(.8)"><use href="#tree"/></g>`;
  let f='';
  if(kind==='hungry')f=`<g transform="translate(196,104) scale(1.5)"><use href="#tiger"/></g>`;
  else if(['scene','talk','caught','walk'].includes(kind))
    f=`<g transform="translate(118,116) scale(1.25)"><use href="#fox"/></g>
       <g transform="translate(412,120) scale(-1.3,1.3)"><use href="#tiger"/></g>`;
  else if(kind==='fox')f=`<g transform="translate(190,108) scale(1.5)"><use href="#fox"/></g>`;
  else if(kind==='tiger')f=`<g transform="translate(180,104) scale(1.5)"><use href="#tiger"/></g>`;
  else if(['run','animals'].includes(kind))
    f=`<g transform="translate(28,168) scale(.7)"><use href="#deer"/></g>
       <g transform="translate(104,202) scale(.53)"><use href="#rabbit"/></g>
       <g transform="translate(298,138) scale(1.3)"><use href="#fox"/></g>
       <g transform="translate(440,126) scale(1.4)"><use href="#tiger"/></g>`;
  else f=`<g transform="translate(118,116) scale(1.25)"><use href="#fox"/></g>
       <g transform="translate(412,120) scale(-1.3,1.3)"><use href="#tiger"/></g>`;
  return `<svg viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet">${bg}${trees}${f}</svg>`;
}

/* 渲染 */
function renderList(){
  $('#storyCount').textContent=STORIES.length;
  const cats={};STORIES.forEach((s,i)=>{(cats[s.cat]=cats[s.cat]||[]).push(i);});
  $('#storyList').innerHTML=Object.keys(cats).map(c=>`<div class="cat">${c}</div>`+
    cats[c].map(i=>`<div class="sitem ${i===state.story?'on':''}" data-story="${i}">
      <span class="n">${String(i+1).padStart(2,'0')}</span>${STORIES[i].name.man}</div>`).join('')).join('');
}
function renderHeader(){const s=S();$('#ttl').innerHTML=`${s.name.man}<small>${s.name.eng}</small>`;}
function renderLangButtons(){
  $$('#langPick button').forEach(b=>{
    const i=state.langs.indexOf(b.dataset.lang);
    b.classList.toggle('on',i>=0);
    b.classList.toggle('sec',i===1);
  });
}
function renderFullRead(){
  const s=S(),p=state.langs[0],btn=$('#fullReadBtn');
  btn.innerHTML=SPK+'<span>朗读全文</span>';
  btn.classList.remove('speaking');
  $('#fullReadTip').textContent=`主要语言：${LNAME[p]} · 朗读标题与全部 ${s.beats.length} 句`;
}
function fullRead(){
  const btn=$('#fullReadBtn');
  if(btn.classList.contains('speaking')){
    speechSynthesis.cancel();btn.classList.remove('speaking');return;
  }
  const s=S(),p=state.langs[0];
  const title=s.name[p]+(p==='eng'?'. ':'。');
  const body=s.beats.map(b=>b[p]).join(p==='eng'?' ':'');
  speak(p,title+body,btn);
}
function renderStory(){
  const s=S(),p=state.langs[0],sec=state.langs[1];
  $('#heroTitles').innerHTML=state.langs.map(l=>`<div class="hrow ${l===p?'main':''}">
    <span class="tg">${LNAME[l]}</span><span class="nm ${l==='eng'?'lat':''}">${s.name[l]}</span>
    ${s.name[l+'R']?`<span class="rm">${s.name[l+'R']}</span>`:''}</div>`).join('');
  $('#storyStrip').innerHTML=`<div class="pic"><img src="${storyImg()}" alt="${s.name.man}插画">
    <span class="lb">${s.name.man} · 故事插画</span></div>`;
  $('#storyLines').innerHTML=s.beats.map((b,i)=>{
    const idx=reg(p,b[p]);
    const big=`<div class="big ${p==='eng'?'lat':''}">${b[p]}</div>${b[p+'R']?`<div class="rom">${b[p+'R']}</div>`:''}`;
    let alt='';
    if(sec){
      const ai=reg(sec,b[sec]);
      alt=`<div class="alt ${sec==='eng'?'lat':''}" data-audio="${ai}">${b[sec]}${b[sec+'R']?`<span class="ar">${b[sec+'R']}</span>`:''}</div>`;
    }
    return `<div class="line"><div class="no">${String(i+1).padStart(2,'0')}</div>
      <div class="tx" data-audio="${idx}">${big}${alt}</div>
      <button class="say" data-audio="${idx}" title="朗读">${SPK}</button></div>`;
  }).join('');
}
function renderWords(){
  const s=S(),p=state.langs[0],sec=state.langs[1];
  const map=w=>({man:[w[0],w[1]],yue:[w[2],w[3]],eng:[w[4],'']});
  $('#wordGrid').innerHTML=s.words.map(w=>{
    const m=map(w),a=m[p],b=sec?m[sec]:null;
    return `<div class="word" data-audio="${reg(p,a[0])}">
      <div class="w ${p==='eng'?'lat':''}">${a[0]}</div>
      <div class="rom">${a[1]||''}</div>
      ${b?`<div class="sec">${b[0]}${b[1]?`<i>${b[1]}</i>`:''}</div>`:''}</div>`;
  }).join('');
}
function renderRetell(){
  const s=S(),p=state.langs[0];
  $('#retellArt').innerHTML=`<img src="${storyImg()}" alt="${s.name.man}插画">`;
  const hints=s.hints||[];
  $('#retellChips').innerHTML=hints.map(h=>`<span class="chip">${h}</span>`).join('');
  $('#revealBox').innerHTML=s.beats.map(b=>
    `<div class="rl"><span class="rr">${b[p+'R']||''}</span>${b[p]}</div>`).join('');
  $('#revealBox').classList.remove('show');$('#revealBtn').textContent='看原文';
}
function renderDiscuss(){
  const s=S();
  $('#discussBox').innerHTML=(s.discuss.basic||[]).map(d=>
    `<div class="qcard"><div class="qq">${d[0]}</div><div class="qe">${d[1]}</div>
     <div class="ans">${d[2]}</div></div>`).join('');
}
function renderCulture(){
  const s=S(),c=s.culture||{},p=state.langs[0],u=c.use||{};
  $('#culMean').textContent=c.m||'—';$('#culEn').textContent=c.en||'';
  $('#culNear').textContent=c.near||'—';$('#culOpp').textContent=c.opp||'—';
  $('#culEx').innerHTML=state.langs.map(l=>`<div class="ex ${l===p?'main':''}">
    <span class="tg">${LNAME[l]}</span>${u[l]||''}${u[l+'R']?`<span class="rr">${u[l+'R']}</span>`:''}</div>`).join('');
  $('#culGist').textContent=(s.beats[s.beats.length-1]||{}).man||'—';
  $('#nextUp').textContent=state.story<STORIES.length-1
    ?`下一则 · ${STORIES[state.story+1].name.man}`:'已是最后一则';
}
function renderAll(){
  AUDIO.length=0;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  renderList();renderHeader();renderLangButtons();renderFullRead();renderStory();
  renderWords();renderRetell();renderDiscuss();renderCulture();
}

/* 导航 */
const TABS=['story','words','retell','discuss','culture'];
function setTab(t){
  state.tab=t;
  $$('.page').forEach(p=>p.classList.toggle('active',p.dataset.tab===t));
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
}
function selectStory(i){
  state.story=i;renderAll();setTab('story');
  const on=$('#storyList .sitem.on');
  if(on)$('#storyList').scrollTop=Math.max(0,on.offsetTop-60);
}
function toggleLang(l){
  const i=state.langs.indexOf(l);
  if(i>=0){
    if(state.langs.length===1){toast('至少保留一种语言');return;}
    state.langs.splice(i,1);
  }else{
    if(state.langs.length>=2)state.langs.shift();
    state.langs.push(l);
  }
  renderAll();
}

/* 事件 */
$('#langPick').addEventListener('click',e=>{const b=e.target.closest('button[data-lang]');if(b)toggleLang(b.dataset.lang);});
$('#sideBtn').onclick=()=>{$('.app').classList.toggle('no-side');};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab);});
$('#storyList').addEventListener('click',e=>{const it=e.target.closest('[data-story]');if(it)selectStory(+it.dataset.story);});
$('#revealBtn').onclick=()=>{const b=$('#revealBox'),o=b.classList.toggle('show');$('#revealBtn').textContent=o?'收起原文':'看原文';};
$('#fullReadBtn').onclick=fullRead;
$('#discussBox').addEventListener('click',e=>{const q=e.target.closest('.qcard');if(q)q.classList.toggle('open');});
document.addEventListener('click',e=>{const a=e.target.closest('[data-audio]');if(a){const x=AUDIO[+a.dataset.audio];if(x)speak(x.lang,x.text,a);}});
document.addEventListener('keydown',e=>{
  let i=TABS.indexOf(state.tab);
  if(e.key==='ArrowRight')setTab(TABS[Math.min(TABS.length-1,i+1)]);
  if(e.key==='ArrowLeft')setTab(TABS[Math.max(0,i-1)]);
});
$('#fullBtn').onclick=()=>{if(!document.fullscreenElement)$('.app').requestFullscreen?.();else document.exitFullscreen?.();};
if('speechSynthesis' in window)speechSynthesis.getVoices();

setTab('story');renderAll();
</script>
</body>
</html>
